[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "towerpilot"
version = "2.0.0a0"
description = "Minimal emulator stream viewer and gem collector for The Tower"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["towerpilot*"]
