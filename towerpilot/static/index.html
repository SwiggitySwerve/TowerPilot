<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tower Pilot</title>
  <style>
    :root {
      --bg: #0a0e16;
      --surface: #111827;
      --surface-2: #172033;
      --border: #1f2b40;
      --border-strong: #2f405e;
      --text: #e6edf7;
      --muted: #8b9bb4;
      --cyan: #22d3ee;
      --cyan-dim: rgba(34, 211, 238, 0.14);
      --pink: #f472b6;
      --pink-dim: rgba(244, 114, 182, 0.14);
      --green: #34d399;
      --green-dim: rgba(52, 211, 153, 0.16);
      --amber: #fbbf24;
      --amber-dim: rgba(251, 191, 36, 0.14);
      --red: #f87171;
      --red-dim: rgba(248, 113, 113, 0.14);
      --radius: 12px;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    button, input {
      font: inherit;
      color: inherit;
    }

    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(250px, 330px) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 780px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.015);
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .version {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex: 0 0 auto;
    }

    .pill.green { color: var(--green); border-color: rgba(52, 211, 153, 0.35); background: var(--green-dim); }
    .pill.cyan  { color: var(--cyan);  border-color: rgba(34, 211, 238, 0.35); background: var(--cyan-dim); }
    .pill.amber { color: var(--amber); border-color: rgba(251, 191, 36, 0.35); background: var(--amber-dim); }
    .pill.red   { color: var(--red);   border-color: rgba(248, 113, 113, 0.35); background: var(--red-dim); }

    /* Left column: live portrait stream */
    .stream-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1080 / 2560;
      max-height: calc(100vh - 96px);
      margin: 0 auto;
      background: #05070c;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #streamImg {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .stream-error {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(248, 113, 113, 0.4);
      color: var(--red);
      font-family: var(--mono);
      font-size: 11px;
      text-align: center;
      word-break: break-word;
    }

    .stream-error[hidden] { display: none; }

    /* Right column: minimal controls */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 2px 2px 0;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    /* Master Harvest Button */
    .harvest-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.06s;
    }

    .harvest-btn:hover {
      background: var(--surface-2);
      border-color: #3f557b;
    }

    .harvest-btn:active {
      transform: translateY(1px);
    }

    .harvest-btn.on {
      background: linear-gradient(180deg, rgba(52, 211, 153, 0.2), rgba(16, 185, 129, 0.1));
      border-color: rgba(52, 211, 153, 0.6);
      box-shadow: 0 0 24px rgba(52, 211, 153, 0.14);
    }

    .harvest-btn.on:hover {
      background: linear-gradient(180deg, rgba(52, 211, 153, 0.26), rgba(16, 185, 129, 0.14));
      border-color: var(--green);
    }

    .harvest-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .power-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #475569;
      box-shadow: 0 0 0 4px rgba(71, 85, 105, 0.22);
      flex: 0 0 auto;
      transition: background 0.15s, box-shadow 0.15s;
    }

    .harvest-btn.on .power-dot {
      background: var(--green);
      box-shadow: 0 0 12px var(--green), 0 0 0 4px rgba(52, 211, 153, 0.22);
    }

    .harvest-label {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .harvest-badge {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--muted);
    }

    .harvest-btn.on .harvest-badge {
      border-color: rgba(52, 211, 153, 0.5);
      background: rgba(52, 211, 153, 0.18);
      color: var(--green);
    }

    /* Mode segmented switch */
    .mode-card {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .mode-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mode-title strong {
      font-size: 13px;
      font-weight: 700;
    }

    .mode-title span {
      font-size: 12px;
      color: var(--muted);
    }

    .seg {
      display: inline-grid;
      grid-template-columns: repeat(2, minmax(78px, 1fr));
      padding: 3px;
      gap: 3px;
      border-radius: 9px;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .seg button {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }

    .seg button:hover {
      color: var(--text);
    }

    .seg button.active {
      background: var(--cyan-dim);
      border-color: rgba(34, 211, 238, 0.45);
      color: var(--cyan);
    }

    /* Gem rows */
    .gem-list {
      display: flex;
      flex-direction: column;
    }

    .gem-row {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .gem-row:last-child {
      border-bottom: none;
    }

    .gem-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .gem-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .gem-name-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .gem-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .gem-dot.ad { background: var(--cyan); }
    .gem-dot.floating { background: var(--pink); }

    .gem-name {
      font-size: 14px;
      font-weight: 700;
    }

    .gem-count {
      font-family: var(--mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .gem-status {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toggle-btn {
      min-width: 66px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
      flex: 0 0 auto;
    }

    .toggle-btn:hover {
      border-color: #455c84;
      color: var(--text);
    }

    .toggle-btn.on.ad {
      background: var(--cyan-dim);
      border-color: rgba(34, 211, 238, 0.5);
      color: var(--cyan);
    }

    .toggle-btn.on.floating {
      background: var(--pink-dim);
      border-color: rgba(244, 114, 182, 0.5);
      color: var(--pink);
    }

    .timer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(47, 64, 94, 0.6);
      flex-wrap: wrap;
    }

    .timer-row[hidden] {
      display: none;
    }

    .timer-row label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .timer-input {
      width: 92px;
      padding: 5px 8px;
      border-radius: 7px;
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .timer-unit {
      font-size: 12px;
      color: var(--muted);
    }

    .timer-human {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      margin-left: auto;
    }

    /* Recent activity strip */
    .activity-list {
      list-style: none;
      margin: 0;
      padding: 6px 0;
      font-family: var(--mono);
      font-size: 12px;
      max-height: 224px;
      overflow-y: auto;
    }

    .activity-item {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 8px;
      padding: 4px 14px;
      border-bottom: 1px solid rgba(31, 43, 64, 0.55);
      align-items: baseline;
    }

    .activity-item:last-child {
      border-bottom: none;
    }

    .activity-ts {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .activity-msg {
      color: var(--text);
      word-break: break-word;
    }

    .activity-empty {
      padding: 14px;
      text-align: center;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 12px;
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      padding: 8px 13px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--cyan);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s;
      z-index: 40;
    }

    .toast.error {
      border-color: var(--red);
      color: var(--red);
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="layout">
      <!-- Left column: Live emulator stream -->
      <section class="card" aria-label="Emulator Stream">
        <div class="card-header">
          <div class="header-left">
            <span id="backendPill" class="pill"><span class="dot"></span>Offline</span>
          </div>
          <span id="battlePill" class="pill"><span class="dot"></span>Waiting</span>
        </div>
        <div id="streamStage" class="stream-stage">
          <img id="streamImg" src="/api/stream.mjpg" alt="Emulator live stream" />
          <div id="streamError" class="stream-error" hidden></div>
        </div>
      </section>

      <!-- Right column: Essential gem harvesting controls -->
      <div class="controls">
        <div class="top-bar">
          <div class="brand">
            <h1>Tower Pilot</h1>
            <span id="versionTag" class="version"></span>
          </div>
          <span id="connPill" class="pill" hidden><span class="dot"></span>Server Offline</span>
        </div>

        <button id="harvestBtn" class="harvest-btn" type="button" aria-pressed="false">
          <span class="harvest-left">
            <span class="power-dot" aria-hidden="true"></span>
            <span id="harvestLabel" class="harvest-label">Gem Harvesting: OFF</span>
          </span>
          <span id="harvestBadge" class="harvest-badge">STOPPED</span>
        </button>

        <section class="card mode-card" aria-label="Collection Mode">
          <div class="mode-title">
            <strong>Collection Mode</strong>
            <span id="modeHint">OCR &amp; vision detection</span>
          </div>
          <div id="modeSeg" class="seg" role="group" aria-label="Collection Mode">
            <button type="button" data-mode="ocr" aria-pressed="true" class="active">OCR</button>
            <button type="button" data-mode="timer" aria-pressed="false">Timer</button>
          </div>
        </section>

        <section class="card gem-list" aria-label="Gem Types">
          <!-- Ad Gems -->
          <div class="gem-row">
            <div class="gem-top">
              <div class="gem-info">
                <div class="gem-name-line">
                  <span class="gem-dot ad" aria-hidden="true"></span>
                  <span class="gem-name">Ad Gems</span>
                  <span id="adCount" class="gem-count" title="Collected this session">0</span>
                </div>
                <div id="adStatus" class="gem-status">idle</div>
              </div>
              <button id="adToggleBtn" class="toggle-btn ad" type="button" aria-pressed="false">OFF</button>
            </div>
            <div id="adTimerRow" class="timer-row" hidden>
              <label for="adTimerInput">Interval</label>
              <input id="adTimerInput" class="timer-input" type="number" min="5" max="86400" step="1" inputmode="numeric" />
              <span class="timer-unit">sec</span>
              <span id="adTimerHuman" class="timer-human"></span>
            </div>
          </div>

          <!-- Floating Gems -->
          <div class="gem-row">
            <div class="gem-top">
              <div class="gem-info">
                <div class="gem-name-line">
                  <span class="gem-dot floating" aria-hidden="true"></span>
                  <span class="gem-name">Floating Gems</span>
                  <span id="floatingCount" class="gem-count" title="Collected this session">0</span>
                </div>
                <div id="floatingStatus" class="gem-status">idle</div>
              </div>
              <button id="floatingToggleBtn" class="toggle-btn floating" type="button" aria-pressed="false">OFF</button>
            </div>
            <div id="floatingTimerRow" class="timer-row" hidden>
              <label for="floatingTimerInput">Interval</label>
              <input id="floatingTimerInput" class="timer-input" type="number" min="5" max="86400" step="1" inputmode="numeric" />
              <span class="timer-unit">sec</span>
              <span id="floatingTimerHuman" class="timer-human"></span>
            </div>
          </div>
        </section>

        <section class="card" aria-label="Recent Activity">
          <div class="card-header">
            <span class="title">Recent Activity</span>
          </div>
          <ul id="activityList" class="activity-list">
            <li class="activity-empty">No recent activity yet.</li>
          </ul>
        </section>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const $ = (id) => document.getElementById(id);

    let lastStatus = null;
    let pollTimer = null;
    let inFlight = 0;
    let serverWasOffline = false;

    function showToast(msg, isError = false) {
      const el = $("toast");
      el.textContent = msg;
      el.className = "toast show" + (isError ? " error" : "");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        el.classList.remove("show");
      }, isError ? 2800 : 1600);
    }

    function fmtDuration(sec) {
      if (sec === null || sec === undefined || !Number.isFinite(Number(sec))) return "";
      const s = Math.max(0, Math.round(Number(sec)));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      if (h > 0) return `${h}h ${String(m).padStart(2, "0")}m`;
      if (m > 0) return `${m}m ${String(r).padStart(2, "0")}s`;
      return `${r}s`;
    }

    function fmtTime(ts) {
      if (!Number.isFinite(Number(ts))) return "--:--:--";
      return new Date(Number(ts) * 1000).toTimeString().slice(0, 8);
    }

    function setPill(el, text, tone) {
      el.className = "pill" + (tone ? " " + tone : "");
      el.textContent = "";
      const dot = document.createElement("span");
      dot.className = "dot";
      el.appendChild(dot);
      el.appendChild(document.createTextNode(text));
    }

    function formatGemStatus(gem, mode) {
      const base = (gem && gem.status) ? String(gem.status) : "idle";
      if (mode === "timer" && gem && gem.enabled && gem.next_timer_sec !== null && gem.next_timer_sec !== undefined) {
        return `${base} · next in ${fmtDuration(gem.next_timer_sec)}`;
      }
      return base;
    }

    function syncTimerInput(inputEl, humanEl, value) {
      if (document.activeElement === inputEl) return;
      if (value !== null && value !== undefined && Number.isFinite(Number(value))) {
        const rounded = Math.round(Number(value));
        if (inputEl.value !== String(rounded)) {
          inputEl.value = String(rounded);
        }
        humanEl.textContent = fmtDuration(rounded);
      }
    }

    function renderActivity(recent) {
      const list = $("activityList");
      list.textContent = "";
      if (!Array.isArray(recent) || recent.length === 0) {
        const li = document.createElement("li");
        li.className = "activity-empty";
        li.textContent = "No recent activity yet.";
        list.appendChild(li);
        return;
      }

      let rows = recent.slice();
      if (rows.length >= 2 && Number(rows[0].ts) < Number(rows[rows.length - 1].ts)) {
        rows = rows.slice(-8).reverse();
      } else {
        rows = rows.slice(0, 8);
      }

      for (const item of rows) {
        const li = document.createElement("li");
        li.className = "activity-item";

        const tsEl = document.createElement("span");
        tsEl.className = "activity-ts";
        tsEl.textContent = fmtTime(item.ts);

        const msgEl = document.createElement("span");
        msgEl.className = "activity-msg";
        msgEl.textContent = item.msg || "";

        li.appendChild(tsEl);
        li.appendChild(msgEl);
        list.appendChild(li);
      }
    }

    function render(data) {
      lastStatus = data;
      $("connPill").hidden = true;

      if (data.version) {
        $("versionTag").textContent = "v" + String(data.version).replace(/^v/i, "");
      }

      // Stream backend + frame size + error
      const stream = data.stream || {};
      const backend = String(stream.backend || "none").toLowerCase();
      if (backend === "mumu") {
        setPill($("backendPill"), "MuMu", "green");
      } else if (backend === "adb") {
        setPill($("backendPill"), "ADB", "cyan");
      } else {
        setPill($("backendPill"), "Offline", "red");
      }

      if (Array.isArray(stream.frame_size) && stream.frame_size.length === 2) {
        const [w, h] = stream.frame_size;
        if (w > 0 && h > 0) {
          $("streamStage").style.aspectRatio = `${w} / ${h}`;
        }
      }

      const streamErr = $("streamError");
      if (stream.error) {
        streamErr.textContent = String(stream.error);
        streamErr.hidden = false;
      } else {
        streamErr.hidden = true;
      }

      // Battle status pill
      const battle = data.battle || {};
      if (battle.blocker) {
        setPill($("battlePill"), String(battle.blocker), "amber");
      } else if (battle.live) {
        setPill($("battlePill"), "Battle Live", "green");
      } else {
        setPill($("battlePill"), "Waiting", "");
      }

      // Master harvesting button
      const running = Boolean(data.running);
      const harvestBtn = $("harvestBtn");
      harvestBtn.className = "harvest-btn" + (running ? " on" : "");
      harvestBtn.setAttribute("aria-pressed", String(running));
      $("harvestLabel").textContent = running ? "Gem Harvesting: ON" : "Gem Harvesting: OFF";
      $("harvestBadge").textContent = running ? "RUNNING" : "STOPPED";

      // Collection mode switch
      const mode = data.mode === "timer" ? "timer" : "ocr";
      $("modeHint").textContent = mode === "timer"
        ? "Periodic taps on fixed timer intervals"
        : "OCR & vision detection";
      for (const btn of $("modeSeg").querySelectorAll("button")) {
        const active = btn.dataset.mode === mode;
        btn.classList.toggle("active", active);
        btn.setAttribute("aria-pressed", String(active));
      }

      // Ad Gems row
      const ad = data.ad_gems || {};
      const adOn = Boolean(ad.enabled);
      const adBtn = $("adToggleBtn");
      adBtn.textContent = adOn ? "ON" : "OFF";
      adBtn.className = "toggle-btn ad" + (adOn ? " on" : "");
      adBtn.setAttribute("aria-pressed", String(adOn));
      $("adCount").textContent = String(ad.count ?? 0);
      $("adStatus").textContent = formatGemStatus(ad, mode);
      $("adTimerRow").hidden = mode !== "timer";
      syncTimerInput($("adTimerInput"), $("adTimerHuman"), ad.timer_interval_sec);

      // Floating Gems row
      const fg = data.floating_gems || {};
      const fgOn = Boolean(fg.enabled);
      const fgBtn = $("floatingToggleBtn");
      fgBtn.textContent = fgOn ? "ON" : "OFF";
      fgBtn.className = "toggle-btn floating" + (fgOn ? " on" : "");
      fgBtn.setAttribute("aria-pressed", String(fgOn));
      $("floatingCount").textContent = String(fg.count ?? 0);
      $("floatingStatus").textContent = formatGemStatus(fg, mode);
      $("floatingTimerRow").hidden = mode !== "timer";
      syncTimerInput($("floatingTimerInput"), $("floatingTimerHuman"), fg.timer_interval_sec);

      // Recent activity
      renderActivity(data.recent);
    }

    async function updateHarvest(payload, toastLabel) {
      inFlight += 1;
      try {
        const res = await fetch("/api/harvest", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || `HTTP ${res.status}`);
        }
        render(data);
        if (toastLabel) showToast(toastLabel);
      } catch (err) {
        showToast(err.message || "Update failed", true);
        if (lastStatus) render(lastStatus);
      } finally {
        inFlight = Math.max(0, inFlight - 1);
      }
    }

    async function pollStatus() {
      clearTimeout(pollTimer);
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (serverWasOffline) {
          serverWasOffline = false;
          $("streamImg").src = "/api/stream.mjpg?t=" + Date.now();
        }
        if (inFlight === 0) {
          render(data);
        }
      } catch (_) {
        serverWasOffline = true;
        const conn = $("connPill");
        setPill(conn, "Server Offline", "red");
        conn.hidden = false;
      } finally {
        pollTimer = setTimeout(pollStatus, 1000);
      }
    }

    // Event bindings
    $("harvestBtn").addEventListener("click", () => {
      const next = !(lastStatus && lastStatus.running);
      updateHarvest({ running: next });
    });

    $("modeSeg").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-mode]");
      if (!btn) return;
      const mode = btn.dataset.mode;
      if (lastStatus && lastStatus.mode === mode) return;
      updateHarvest({ mode });
    });

    $("adToggleBtn").addEventListener("click", () => {
      const next = !(lastStatus && lastStatus.ad_gems && lastStatus.ad_gems.enabled);
      updateHarvest({ ad_gems: { enabled: next } });
    });

    $("floatingToggleBtn").addEventListener("click", () => {
      const next = !(lastStatus && lastStatus.floating_gems && lastStatus.floating_gems.enabled);
      updateHarvest({ floating_gems: { enabled: next } });
    });

    function bindTimerInput(inputEl, humanEl, key) {
      inputEl.addEventListener("input", () => {
        const v = Number(inputEl.value);
        humanEl.textContent = (Number.isFinite(v) && v > 0) ? fmtDuration(v) : "";
      });

      const commit = () => {
        const val = Number(inputEl.value);
        if (!Number.isFinite(val) || val <= 0) {
          if (lastStatus && lastStatus[key]) {
            const prev = Math.round(Number(lastStatus[key].timer_interval_sec || 0));
            inputEl.value = prev > 0 ? String(prev) : "";
            humanEl.textContent = fmtDuration(prev);
          }
          showToast("Enter a positive number of seconds", true);
          return;
        }
        updateHarvest({ [key]: { timer_interval_sec: val } }, "Timer updated");
      };

      inputEl.addEventListener("change", commit);
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          inputEl.blur();
        }
      });
    }

    bindTimerInput($("adTimerInput"), $("adTimerHuman"), "ad_gems");
    bindTimerInput($("floatingTimerInput"), $("floatingTimerHuman"), "floating_gems");

    // Start polling
    pollStatus();
  </script>
</body>
</html>
