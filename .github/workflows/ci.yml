name: CI
on:
  push:
    branches: [master, v2/*]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Unit tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m py_compile app.py towerpilot/adb.py towerpilot/capture.py towerpilot/collector.py towerpilot/config.py towerpilot/detectors.py towerpilot/input.py towerpilot/mumu_worker.py towerpilot/ocr.py towerpilot/tray.py
      - name: Run unit tests
        run: python -m pytest
